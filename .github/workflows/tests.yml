name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml flask pytest

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches a broken Dockerfile (missing COPY, bad RUN) without needing
      # to notice it at deploy time on the host.
      - name: Build image
        run: docker build -t sundaysignal:ci .

      - name: Smoke-test the image
        run: |
          docker run --rm sundaysignal:ci python -c "import webapp, sundaysignal_scraper, healthcheck; print('imports OK')"
          docker run --rm sundaysignal:ci python -c "import version; print('version:', version.VERSION, 'build:', version.BUILD_TIME)"
